name: ci

# CPU-only. The real-GPU tests are marked `rocm_hardware` and are excluded by default (pyproject addopts); they run
# only on the actual R9700 + RX 9070 XT workstation: `python -m pytest -m rocm_hardware`.
on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install (CPU torch is enough, the DDP equivalence test runs on CPU)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: Byte-compile
        run: python -m compileall -q dual_gpu_setup app.py launch_service.py scripts
      - name: Shell syntax, if any shell scripts exist
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: "Unit tests (config loading, Linux paths, fake sysfs/procfs telemetry, tracker/lease HTTP, lane keys)"
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q
      - name: Service config check
        run: python app.py --config example.dual_gpu.ubuntu.toml --data-dir "$RUNNER_TEMP/dgpu-data" --check
      - name: No drive-letter paths in the committed Ubuntu example
        run: "! grep -nE '[A-Za-z]:[\\/]' example.dual_gpu.ubuntu.toml"
