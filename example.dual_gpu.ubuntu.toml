[project]
name = "shared-eval-stack"
suite_prefix = "dualgpu"
log_dir = "./runs"
host = "127.0.0.1"
cleanup_ports_on_start = true
start_timeout_seconds = 900
# Full per-model API input/output and telemetry archive (asynchronous, separate SQLite database).
store_chat_history = true

[discovery]
# Build llama.cpp with the ROCm backend and make this file executable (chmod +x).
# An explicit binary keeps Ubuntu independent of LM Studio.
backend_server_binaries = { rocm = "/opt/llama.cpp/build/bin/llama-server" }
models_dir = "/srv/models"
multi_gpu_runtime = "configured"

[policy]
vram_safety_fraction = 0.90
ctx_min = 16384
ctx_mid = 32768
ctx_max = 49152
ctx_mid_headroom_gb = 5
ctx_max_headroom_gb = 10
safety_tokens = 256
reasoning_mode = "off"
reasoning_budget = 0
cache_reuse = 256
flash_attn = "auto"
gpu_layers = 999
parallel = 1
no_mmproj = true
jinja = true
kill_busy_ports = true
health_poll_seconds = 1.0
settle_seconds_after_restart = 2.0
load_mode = "none"
cache_ram_mib = 0
vram_admission = true
vram_headroom_gb = 1.0
auto_load_models = true
# Linux does not page dedicated VRAM out in the Windows-specific way this guard handles.
residency_guard = false

# Lane keys MUST be exactly "r9700" and "9070xt": the SLM trainer (SLM_training, `dgpu.rank_lanes`) addresses GPUs by
# these keys, and rank 0 (evals + checkpoints) is the 32 GB R9700.  A CI test in both repositories enforces this.
#
# PCI bus is the PRIMARY identity: a lane with `pci_bus` is matched only by that address; `match` (marketing name)
# and `vram_gb` are fallbacks for lanes WITHOUT a pci_bus.  Fill in the real addresses of this machine:
#     python scripts/detect_linux_lanes.py          # prints these stanzas with the detected pci_bus values
# then uncomment / paste the pci_bus lines.  (`lspci -nn | grep -i 'AMD/ATI'` shows the same addresses.)
[[lanes]]
key = "r9700"
display = "AMD Radeon AI PRO R9700"
# Match a unique substring printed by: llama-server --list-devices   (fallback only)
match = "R9700"
vram_gb = 32
port = 8081
backend = "rocm"
# pci_bus = "0000:03:00.0"   # <- REQUIRED for certification: set to the detected Linux PCI bus

[[lanes]]
key = "9070xt"
display = "AMD Radeon RX 9070 XT"
match = "9070 XT"
vram_gb = 16
port = 8082
backend = "rocm"
# pci_bus = "0000:0b:00.0"   # <- REQUIRED for certification: set to the detected Linux PCI bus

[[models]]
name = "example-small-model"
path = "example/model-Q4_K_M.gguf"

# Add your evaluator after its path and arguments are known.
