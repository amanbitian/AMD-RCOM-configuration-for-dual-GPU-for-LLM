[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-gpu-setup"
version = "0.1.0"
description = "Reusable dual-GPU llama-server orchestration for eval workloads"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
dual-gpu = "dual_gpu_setup.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dual_gpu_setup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's default basetemp (a shared dir under the system temp root) can hit permission
# errors in some sandboxed environments; keeping it inside the repo avoids that.
addopts = "--basetemp=.pytest_tmp"
